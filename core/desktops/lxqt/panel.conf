[General]
panels=@panels@
iconTheme=noir-breeze-dark

[top]
position=Top
panelSize=38
iconSize=22
width=100
width-percent=true
reserve-space=true
hidable=false
plugins=fancymenu,clock,statusnotifier,mount,volume,desktopswitch,showdesktop

[bottom]
position=Bottom
panelSize=42
iconSize=28
alignment=0
fit-to-content=true
reserve-space=false
hidable=true
hide-on-overlap=true
plugins=quicklaunch,bottom-tasks

[fancymenu]
type=fancymenu
ownIcon=true
icon=@nixIcon@
filterClear=true
autoSel=true
autoSelDelay=150
@favorites@

[clock]
alignment=Right
centered=true
type=worldclock
formatType=short-timeonly
showDate=false

[statusnotifier]
alignment=Right
type=statusnotifier

[mount]
alignment=Right
type=mount

[volume]
alignment=Right
type=volume

[desktopswitch]
alignment=Right
type=desktopswitch

[showdesktop]
alignment=Right
type=showdesktop

[quicklaunch]
type=quicklaunch
@launchers@

[bottom-tasks]
type=taskbar
buttonStyle=Icon
groupingEnabled=true
showOnlyOneDesktopTasks=true
